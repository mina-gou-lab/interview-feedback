<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>メゾンキツネ 面談カード</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"><style>:root{--bg:#FAFAF7;--surface:#FFFFFF;--surface-2:#F3EEE3;--text:#221F1B;--text-muted:#726B5D;--border:#E7E0D2;--accent:#8C7452;--accent-strong:#6B5636;--shadow:0 1px 2px rgba(34,31,27,.04), 0 10px 26px rgba(34,31,27,.07);--font-display:'Shippori Mincho', serif;--font-body:'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif;--radius-lg:18px;--radius-md:12px;}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16140F;--surface:#201D17;--surface-2:#2B2419;--text:#F3EEE3;--text-muted:#A99E89;--border:#39311F;--accent:#D8BA8B;--accent-strong:#EAD5AA;--shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.5);}}:root[data-theme="dark"]{--bg:#16140F;--surface:#201D17;--surface-2:#2B2419;--text:#F3EEE3;--text-muted:#A99E89;--border:#39311F;--accent:#D8BA8B;--accent-strong:#EAD5AA;--shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.5);}*{box-sizing:border-box;}html{-webkit-text-size-adjust:100%;}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;}button{font:inherit;color:inherit;}:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}.shell{max-width:640px;margin:0 auto;padding:36px 20px 90px;}.staff-header{text-align:center;padding-bottom:30px;margin-bottom:26px;border-bottom:1px solid var(--border);}.staff-header .brand{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,7vw,34px);letter-spacing:.03em;text-wrap:balance;}.staff-header .doc-type{margin-top:12px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);}.staff-header .staff-name{margin-top:6px;font-size:16px;color:var(--text-muted);}.qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 20px;margin-bottom:16px;box-shadow:var(--shadow);}.qcard-head{display:flex;gap:14px;align-items:flex-start;}.qnum{font-family:var(--font-display);font-size:14px;color:var(--accent-strong);padding-top:4px;flex:none;min-width:20px;font-weight:700;}.qtext{margin:0;flex:1;font-size:17px;font-weight:700;line-height:1.65;text-wrap:balance;}.reveal-btn{margin-top:16px;width:100%;padding:13px 16px;border-radius:var(--radius-md);border:1px solid var(--accent);background:transparent;color:var(--accent-strong);font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;}.reveal-btn .chevron{transition:transform .25s ease;font-size:11px;}.reveal-btn[aria-expanded="true"]{background:var(--surface-2);}.reveal-btn[aria-expanded="true"] .chevron{transform:rotate(180deg);}.answer-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease;}.answer-wrap.open{grid-template-rows:1fr;}.answer-inner{overflow:hidden;min-height:0;}.answer-inner-pad{padding-top:18px;border-top:1px solid var(--border);margin-top:16px;}.answer-label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-strong);font-weight:700;margin-bottom:8px;}.answer-text{margin:0;font-size:15.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word;}.empty-state{text-align:center;padding:44px 16px;color:var(--text-muted);font-size:14px;}</style></head><body><div id="app"></div><script>var DATA = {"brand":"メゾンキツネ","staffName":"菊池さん","questions":[{"q":"志望理由を教えてください。","a":"ファッションと音楽、カフェ文化が融合した独自のライフスタイル提案に強く魅了されたからです。時代を超えて愛されるタイムレスなデザインの魅力を通し、お客様の毎日に新しい彩りを届ける接客に貢献したく志望いたしました。"},{"q":"ブランドの印象を教えてください。","a":"パリのフレンチリビエラと東京のストリート文化が融合した、モダンで遊び心あふれるブランドです。洗練された上質さと親しみやすさを兼ね備え、国籍や世代を越えて世界中の人々を惹きつける強い世界観を感じています。"},{"q":"店舗を見た時の雰囲気や、接客の印象を教えてください。","a":"洗練された空間の中で、スタッフの皆様が自然体かつフランクにお客様と会話を楽しんでいる姿が印象的でした。ブランドのカルチャーを肌で感じられる温かな接客に惹かれ、自分もこの空間を作りたいと感じました。"},{"q":"長所、短所を教えてください。","a":"長所は誰とでも素早く信頼関係を築ける親しみやすさです。短所は物事を抱え込みやすい点ですが、チームで細かく状況を共有し、周囲と協力しながら効率的に業務を進めるよう常に意識して行動しています。"}]};function escapeHtml(str){return String(str==null?'':str).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function pad(n){return String(n).padStart(2,'0');}function render(){var app=document.getElementById('app');var questions=DATA.questions||[];var cardsHtml=questions.map(function(q,i){return ('<article class="qcard"><div class="qcard-head"><span class="qnum">'+pad(i+1)+'</span><h2 class="qtext">'+escapeHtml(q.q)+'</h2></div><button type="button" class="reveal-btn" aria-expanded="false" data-idx="'+i+'"><span class="reveal-label">解答例を見る</span><span class="chevron" aria-hidden="true">▾</span></button><div class="answer-wrap" id="answer-'+i+'"><div class="answer-inner"><div class="answer-inner-pad"><div class="answer-label">解答例</div><p class="answer-text">'+escapeHtml(q.a)+'</p></div></div></div></article>');}).join('');app.innerHTML='<div class="shell"><header class="staff-header"><div class="brand">'+escapeHtml(DATA.brand||'')+'</div><div class="doc-type">面談回答例</div><div class="staff-name">'+escapeHtml(DATA.staffName||'')+'</div></header><div class="cards">'+(questions.length?cardsHtml:'<div class="empty-state">まだ質問が登録されていません。</div>')+'</div></div>';app.querySelectorAll('.reveal-btn').forEach(function(btn){btn.addEventListener('click',function(){var idx=btn.getAttribute('data-idx');var wrap=document.getElementById('answer-'+idx);var isOpen=btn.getAttribute('aria-expanded')==='true';btn.setAttribute('aria-expanded',String(!isOpen));wrap.classList.toggle('open',!isOpen);btn.querySelector('.reveal-label').textContent=isOpen?'解答例を見る':'解答例を隠す';});});}render();</script></body></html>
