<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Maison Kitsune 面談カード</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"><style>:root{--bg:#FAFAF7;--surface:#FFFFFF;--surface-2:#F3EEE3;--text:#221F1B;--text-muted:#726B5D;--border:#E7E0D2;--accent:#8C7452;--accent-strong:#6B5636;--shadow:0 1px 2px rgba(34,31,27,.04), 0 10px 26px rgba(34,31,27,.07);--font-display:'Shippori Mincho', serif;--font-body:'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif;--radius-lg:18px;--radius-md:12px;}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16140F;--surface:#201D17;--surface-2:#2B2419;--text:#F3EEE3;--text-muted:#A99E89;--border:#39311F;--accent:#D8BA8B;--accent-strong:#EAD5AA;--shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.5);}}:root[data-theme="dark"]{--bg:#16140F;--surface:#201D17;--surface-2:#2B2419;--text:#F3EEE3;--text-muted:#A99E89;--border:#39311F;--accent:#D8BA8B;--accent-strong:#EAD5AA;--shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.5);}*{box-sizing:border-box;}html{-webkit-text-size-adjust:100%;}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;}button{font:inherit;color:inherit;}:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}.shell{max-width:640px;margin:0 auto;padding:36px 20px 90px;}.staff-header{text-align:center;padding-bottom:30px;margin-bottom:26px;border-bottom:1px solid var(--border);}.staff-header .brand{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,7vw,34px);letter-spacing:.03em;text-wrap:balance;}.staff-header .doc-type{margin-top:12px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);}.staff-header .staff-name{margin-top:6px;font-size:16px;color:var(--text-muted);}.qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 20px;margin-bottom:16px;box-shadow:var(--shadow);}.qcard-head{display:flex;gap:14px;align-items:flex-start;}.qnum{font-family:var(--font-display);font-size:14px;color:var(--accent-strong);padding-top:4px;flex:none;min-width:20px;font-weight:700;}.qtext{margin:0;flex:1;font-size:17px;font-weight:700;line-height:1.65;text-wrap:balance;}.reveal-btn{margin-top:16px;width:100%;padding:13px 16px;border-radius:var(--radius-md);border:1px solid var(--accent);background:transparent;color:var(--accent-strong);font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;}.reveal-btn .chevron{transition:transform .25s ease;font-size:11px;}.reveal-btn[aria-expanded="true"]{background:var(--surface-2);}.reveal-btn[aria-expanded="true"] .chevron{transform:rotate(180deg);}.answer-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease;}.answer-wrap.open{grid-template-rows:1fr;}.answer-inner{overflow:hidden;min-height:0;}.answer-inner-pad{padding-top:18px;border-top:1px solid var(--border);margin-top:16px;}.answer-label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-strong);font-weight:700;margin-bottom:8px;}.answer-text{margin:0;font-size:15.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word;}.empty-state{text-align:center;padding:44px 16px;color:var(--text-muted);font-size:14px;}</style></head><body><div id="app"></div><script>var DATA = {"brand":"Maison Kitsune","staffName":"秋月さん","questions":[{"q":"自己紹介＋志望動機","a":"はじめまして。〇〇と申します。\n本日は貴重なお時間をいただきありがとうございます。\n〜大学のこと〜\n御社を志望した理由は、世界的に有名なブランドであるメゾン キツネで、ブランドの世界観や魅力を学びながら、お客様にその魅力を伝えられる接客を身につけたいと思ったためです。\nよろしくお願いいたします。"},{"q":"コンビニはなぜ始めた？","a":"自宅から近かったことと様々な対応が経験できると思い始めました。"},{"q":"ハンバーガー店で働き始めた理由","a":"将来的に留学を考えており、インバウンドのお客様が多い環境で働いてみたいと思い始めました。\n┗実際に9割以上は海外のお客様で、英語を使用してのレジ業務の経験がある。"},{"q":"留学に行きたい理由は？","a":"商社への就職を目指しており、海外のお客様を相手にするため英語スキルを身につけたいと思ったためです。\n┗再来年頃の予定"},{"q":"ハンバーガーショップの業務内容","a":"レジ業務がメインで、英語を多く使用しております。"},{"q":"今のお仕事で大変なことは？","a":"語学スキルの部分で、うまく英語で伝えられないことがありました。そのため日頃から英作文の参考書を使用して勉強することで英語スキルの向上にも努めています。"},{"q":"なぜ飲食店やコンビニではなく、アパレルで働きたいと思った？","a":"アパレルでは、目的の商品を決めずに来店されるお客様も多いため、会話をしながら好みやニーズを引き出し、自分の提案で購入につなげる力が身につくと考えています。飲食店やコンビニでの接客経験を活かしながら、より提案力や販売力を高めたいと思い、アパレルで働きたいと考えました。"},{"q":"ブランドの印象","a":"シンプルでありながら品のあるデザインが多く、上品で洗練されたブランドという印象がございます。また、カジュアルさもあり、普段のファッションに取り入れやすいところも魅力だと感じています。"},{"q":"店舗の雰囲気や、接客の印象","a":"明日の店舗見学後に考えてみてください＾＾"},{"q":"性格的な長所、短所","a":"【長所】\n協調性があるところです。4歳から高校3年生までサッカーを続けていたので、チームで声を掛け合いながら、一つの目標に向かって協力することを大切にしてきました。仕事でも周りのスタッフとコミュニケーションを取りながら、協力して働くことを意識しています。\n【短所】\n周りに合わせすぎてしまうところです。自分の意見があっても、相手の意見を優先してしまうことがあります。そのため最近は、周りの意見を聞いた上で、自分の考えもしっかり伝えるように意識しています。"},{"q":"普段どこで洋服を買う？","a":"普段は古着を買うことが多いです。いろいろなアイテムを組み合わせたり店員の方と話しながら、自分らしいコーディネートを考えることが好きなので、普段からファッションを楽しんでいます。"},{"q":"キツネを選んだ理由","a":"ラグジュアリーブランドで働いている先輩の話を聞き、私もより高い接客スキルを身につけたいと思ったことがきっかけです。数あるブランドの中でも、御社は以前から知っており、自分と同年代の方からも人気がある印象でした。自分も挑戦してみたいと思い、志望いたしました。"}]};function escapeHtml(str){return String(str==null?'':str).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function pad(n){return String(n).padStart(2,'0');}function render(){var app=document.getElementById('app');var questions=DATA.questions||[];var cardsHtml=questions.map(function(q,i){return ('<article class="qcard"><div class="qcard-head"><span class="qnum">'+pad(i+1)+'</span><h2 class="qtext">'+escapeHtml(q.q)+'</h2></div><button type="button" class="reveal-btn" aria-expanded="false" data-idx="'+i+'"><span class="reveal-label">解答例を見る</span><span class="chevron" aria-hidden="true">▾</span></button><div class="answer-wrap" id="answer-'+i+'"><div class="answer-inner"><div class="answer-inner-pad"><div class="answer-label">解答例</div><p class="answer-text">'+escapeHtml(q.a)+'</p></div></div></div></article>');}).join('');app.innerHTML='<div class="shell"><header class="staff-header"><div class="brand">'+escapeHtml(DATA.brand||'')+'</div><div class="doc-type">面談回答例</div><div class="staff-name">'+escapeHtml(DATA.staffName||'')+'</div></header><div class="cards">'+(questions.length?cardsHtml:'<div class="empty-state">まだ質問が登録されていません。</div>')+'</div></div>';app.querySelectorAll('.reveal-btn').forEach(function(btn){btn.addEventListener('click',function(){var idx=btn.getAttribute('data-idx');var wrap=document.getElementById('answer-'+idx);var isOpen=btn.getAttribute('aria-expanded')==='true';btn.setAttribute('aria-expanded',String(!isOpen));wrap.classList.toggle('open',!isOpen);btn.querySelector('.reveal-label').textContent=isOpen?'解答例を見る':'解答例を隠す';});});}render();</script></body></html>
